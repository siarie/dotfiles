unbind C-b
set-option -g prefix C-Space

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',xterm-256color:Tc'

set -g base-index 1
set -g renumber-windows on
set -g visual-activity on
setw -g monitor-activity on

set-option -g allow-rename on
set-option -sg escape-time 10
set-option -g focus-events on

# Status line
bind C-s set-option -g status

set -g status off
set -g status-style fg=black,bg=yellow
set -g status-left ""
set -g status-right "#[bg=yellow,fg=black,bold]#{?client_prefix,#[bg=red],}[#S]"
set-option -g status-position top

# Pane
set -g pane-border-status top
set -g pane-border-format "(#{session_id}) #{window_id}/#{pane_index}/#{pane_current_command}"

# Window Status
set -g window-status-format " #I:#W "
set -g window-status-style  bg=yellow,fg=black

set -g window-status-current-format " #I:#W "
set -g window-status-current-style  bg=black,fg=white

set -g window-status-separator ""

# Key Binding
#############

# add binding to reload configuration
bind R source-file ~/.config/tmux/tmux.conf \; display " reloading configuration..."

# Pane spliting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

set -g status-interval 1
